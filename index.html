<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonificación de Nebulosa</title>
  <style>
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    p {
      color: #a0a0b0;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .container {
      position: relative;
      max-width: 90vw;
      max-height: 75vh;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Garantiza máxima fidelidad visual y evita reescalados que degraden la calidad */
    #imageCanvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
      cursor: pointer;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .status {
      margin-top: 15px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #64ffda;
    }
  </style>
</head>
<body>

  <h1>Sonificación de Nebulosa</h1>
  <p>Pasa el cursor o haz clic en la imagen para reproducir la nota asignada.</p>

  <div class="container">
    <canvas id="imageCanvas"></canvas>
  </div>

  <div class="status" id="statusText">Cargando imagen...</div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusText = document.getElementById('statusText');

    let audioCtx = null;
    let img = new Image();
    img.src = 'Nebulosa.webp'; // Asegúrate de que el archivo esté en la misma carpeta

    // Escala pentatónica para que cualquier píxel suene armónico como un piano
    const pianoNotes = [
      130.81, 146.83, 164.81, 196.00, 220.00, // C3 - A3
      261.63, 293.66, 329.63, 392.00, 440.00, // C4 - A4
      523.25, 587.33, 659.25, 783.99, 880.00, // C5 - A5
      1046.50, 1174.66, 1318.51, 1567.98, 1760.00 // C6 - A6
    ];

    img.onload = () => {
      // Mantiene la calidad y dimensiones exactas de la imagen original
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      statusText.textContent = 'Mueve el cursor sobre la imagen para sonificar.';
    };

    img.onerror = () => {
      statusText.textContent = 'Error: Coloca la imagen Nebulosa.webp en el mismo directorio.';
    };

    // Inicializar AudioContext tras interacción del usuario
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Algoritmo de mapeo RGB -> Frecuencia, Volumen y Efecto (Tremolo)
    function playToneFromRGB(r, g, b) {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // 1. Canal R (Rojo) -> Mapeo a nota/frecuencia de piano
      const noteIndex = Math.floor((r / 255) * (pianoNotes.length - 1));
      const frequency = pianoNotes[noteIndex];

      // 2. Canal G (Verde) -> Mapeo a volumen (0 a 0.5 para no saturar)
      const volume = (g / 255) * 0.5;

      // 3. Canal B (Azul) -> Mapeo a efecto (Frecuencia de Trémolo / Modulación)
      const effectSpeed = (b / 255) * 15; // De 0Hz a 15Hz

      if (volume <= 0.01) return; // Omitir píxeles casi negros

      // Creación del sintetizador de piano (Oscilador + Armónicos)
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      // Forma de onda tipo piano (Mezcla de corte de onda suave)
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(frequency, now);

      // Efecto (Canal B): Modulación por trémolo mediante un LFO
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(effectSpeed, now);
      lfoGain.gain.setValueAtTime(volume * 0.3, now); // Intensidad del efecto
      lfo.connect(lfoGain.gain);

      // Envolvente de volumen tipo Piano (Attack rápido, Decay gradual)
      gainNode.gain.setValueAtTime(0.001, now);
      gainNode.gain.linearRampToValueAtTime(volume, now + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

      // Conexiones de audio
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      lfo.start(now);
      osc.start(now);

      // Detener y limpiar nodos
      osc.stop(now + 1.2);
      lfo.stop(now + 1.2);

      statusText.textContent = `RGB(${r}, ${g}, ${b}) | Freq: ${Math.round(frequency)}Hz | Vol: ${Math.round(volume * 100)}% | FX Rate: ${effectSpeed.toFixed(1)}Hz`;
    }

    // Captura de coordenadas precisas
    function handlePointer(e) {
      initAudio();

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
        const pixelData = ctx.getImageData(x, y, 1, 1).data;
        playToneFromRGB(pixelData[0], pixelData[1], pixelData[2]);
      }
    }

    let lastExecution = 0;
    canvas.addEventListener('mousemove', (e) => {
      // Throttle para limitar la generación de notas y evitar saturación de audio
      if (Date.now() - lastExecution > 100) {
        handlePointer(e);
        lastExecution = Date.now();
      }
    });

    canvas.addEventListener('click', handlePointer);
  </script>
</body>
</html>
