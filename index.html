<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonificador de la Nebulosa HD</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #0b0b10; color: #fff; }
    .container { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    
    .image-preview-container {
      position: relative;
      width: 100%;
      max-height: 500px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #333;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #displayImage {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      display: block;
    }

    #pointer {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffcc, inset 0 0 5px #00ffcc;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    
    #hiddenCanvas { display: none; }

    .controls { display: flex; gap: 10px; }
    button { padding: 12px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { font-family: monospace; background: #161622; padding: 12px; border-radius: 4px; border: 1px solid #333; color: #00ffcc; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sonificación: Nebulosa</h2>
  
  <div class="image-preview-container" id="stage">
    <!-- Imagen cargada por defecto mediante Base64 -->
    <img id="displayImage" alt="Nebulosa">
    <div id="pointer"></div>
  </div>
  
  <canvas id="hiddenCanvas"></canvas>

  <div class="controls">
    <button id="playBtn" disabled>Iniciar Sonificación</button>
    <button id="stopBtn" disabled>Detener</button>
  </div>
  
  <div id="status">Cargando Nebulosa por defecto...</div>
</div>

<script>
  const displayImage = document.getElementById('displayImage');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const pointer = document.getElementById('pointer');
  const ctx = hiddenCanvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  let audioCtx = null;
  let isPlaying = false;
  let timerId = null;

  // Escala natural Do a Si (3 octavas)
  const freqScale = [
    130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94,
    261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
    523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77
  ];

  const noteNames = [
    "Do3","Re3","Mi3","Fa3","Sol3","La3","Si3",
    "Do4","Re4","Mi4","Fa4","Sol4","La4","Si4",
    "Do5","Re5","Mi5","Fa5","Sol5","La5","Si5"
  ];

  // Cargar imagen por defecto al iniciar la página
  window.addEventListener('load', () => {
    // URL/Data en Base64 directa de la Nebulosa
    displayImage.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><defs><radialGradient id='g1' cx='30%' cy='30%' r='70%'><stop offset='0%' stop-color='%2300ffff'/><stop offset='40%' stop-color='%23ff007f'/><stop offset='80%' stop-color='%23ffaa00'/><stop offset='100%' stop-color='%23050515'/></radialGradient><radialGradient id='g2' cx='70%' cy='70%' r='60%'><stop offset='0%' stop-color='%23ff0055'/><stop offset='50%' stop-color='%237700ff'/><stop offset='100%' stop-color='%23000000'/></radialGradient></defs><rect width='100%' height='100%' fill='%23050515'/><circle cx='140' cy='140' r='180' fill='url(%23g1)' opacity='0.85'/><circle cx='260' cy='260' r='160' fill='url(%23g2)' opacity='0.75'/></svg>";
  });

  displayImage.addEventListener('load', () => {
    const PROC_SIZE = 80;
    let w = displayImage.naturalWidth || 400;
    let h = displayImage.naturalHeight || 400;
    
    if (w > h) {
      h = Math.round((h * PROC_SIZE) / w);
      w = PROC_SIZE;
    } else {
      w = Math.round((w * PROC_SIZE) / h);
      h = PROC_SIZE;
    }

    hiddenCanvas.width = w;
    hiddenCanvas.height = h;
    ctx.drawImage(displayImage, 0, 0, w, h);
    
    playBtn.disabled = false;
    status.textContent = 'Nebulosa por defecto lista. Presiona "Iniciar Sonificación".';
  });

  function playTone(freq, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  }

  function updatePointer(x, y, w, h) {
    const rect = displayImage.getBoundingClientRect();
    const stageRect = document.getElementById('stage').getBoundingClientRect();

    const px = (x / w) * rect.width + (rect.left - stageRect.left);
    const py = (y / h) * rect.height + (rect.top - stageRect.top);

    pointer.style.left = `${px}px`;
    pointer.style.top = `${py}px`;
  }

  playBtn.addEventListener('click', () => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isPlaying = true;
    playBtn.disabled = true;
    stopBtn.disabled = false;
    pointer.style.display = 'block';

    const w = hiddenCanvas.width;
    const h = hiddenCanvas.height;
    const imgData = ctx.getImageData(0, 0, w, h).data;
    
    let x = 0, y = 0;

    timerId = setInterval(() => {
      if (!isPlaying) return;

      const idx = (y * w + x) * 4;
      const r = imgData[idx];
      const g = imgData[idx + 1];
      const b = imgData[idx + 2];

      const noteIdx = Math.floor((r / 255) * (freqScale.length - 1));
      const freq = freqScale[noteIdx];
      const noteName = noteNames[noteIdx];
      const volume = (g / 255) * 0.3;

      if (volume > 0.005) {
        playTone(freq, volume);
      }

      updatePointer(x, y, w, h);
      status.textContent = `Posición (${x}, ${y}) | R:${r} -> ${noteName} | G:${g} -> Vol: ${Math.round((g/255)*100)}% | B:${b}`;

      x++;
      if (x >= w) { x = 0; y++; }
      if (y >= h) {
        stopAudio();
        status.textContent = 'Sonificación finalizada.';
      }
    }, 80);
  });

  function stopAudio() {
    isPlaying = false;
    if (timerId) clearInterval(timerId);
    playBtn.disabled = false;
    stopBtn.disabled = true;
    pointer.style.display = 'none';
  }

  stopBtn.addEventListener('click', stopAudio);
</script>

</body>
</html>
