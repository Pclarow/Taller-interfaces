<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonificador de Imagen HD</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #fff; }
    .container { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    
    /* Previsualización en ALTA CALIDAD */
    .image-preview-container {
      position: relative;
      width: 100%;
      max-height: 500px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #333;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #displayImage {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      display: none;
    }
    
    /* Canvas procesador (OCULTO) */
    #hiddenCanvas { display: none; }

    .controls { display: flex; gap: 10px; }
    button { padding: 12px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:disabled { background: #444; cursor: not-allowed; }
    input[type="file"] { background: #222; padding: 10px; border-radius: 4px; color: #fff; border: 1px solid #333; }
    #status { font-family: monospace; background: #1a1a1a; padding: 12px; border-radius: 4px; border: 1px solid #333; color: #00ffcc; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sonificador RGB (Calidad HD)</h2>
  <input type="file" id="imageInput" accept="image/*">
  
  <div class="image-preview-container">
    <img id="displayImage" alt="Previsualización de imagen">
  </div>
  
  <!-- Canvas invisible para procesamiento masivo -->
  <canvas id="hiddenCanvas"></canvas>

  <div class="controls">
    <button id="playBtn" disabled>Iniciar Sonificación</button>
    <button id="stopBtn" disabled>Detener</button>
  </div>
  
  <div id="status">Selecciona una imagen para comenzar.</div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const displayImage = document.getElementById('displayImage');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const ctx = hiddenCanvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  let audioCtx = null;
  let isPlaying = false;
  let timerId = null;

  // Escala natural Do a Si (3 octavas) en Frecuencias (Hz)
  const freqScale = [
    130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, // Do3 a Si3
    261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, // Do4 a Si4
    523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77  // Do5 a Si5
  ];

  const noteNames = [
    "Do3","Re3","Mi3","Fa3","Sol3","La3","Si3",
    "Do4","Re4","Mi4","Fa4","Sol4","La4","Si4",
    "Do5","Re5","Mi5","Fa5","Sol5","La5","Si5"
  ];

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      // 1. Mostrar la imagen ORIGINAL sin modificar para nitidez HD completa
      displayImage.src = img.src;
      displayImage.style.display = 'block';

      // 2. Escalar internamente el canvas oculto a 80px para lecturas de audio ágiles
      const PROC_SIZE = 80;
      let w = img.width;
      let h = img.height;
      
      if (w > h) {
        h = Math.round((h * PROC_SIZE) / w);
        w = PROC_SIZE;
      } else {
        w = Math.round((w * PROC_SIZE) / h);
        h = PROC_SIZE;
      }

      hiddenCanvas.width = w;
      hiddenCanvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      
      playBtn.disabled = false;
      status.textContent = 'Imagen cargada en HD. Lista para sonificar.';
    };
    img.src = URL.createObjectURL(file);
  });

  // Generador sintetizado mediante Web Audio API puro
  function playTone(freq, volume) {
    if (!audioCtx) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  }

  playBtn.addEventListener('click', () => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isPlaying = true;
    playBtn.disabled = true;
    stopBtn.disabled = false;

    const w = hiddenCanvas.width;
    const h = hiddenCanvas.height;
    const imgData = ctx.getImageData(0, 0, w, h).data;
    
    let x = 0;
    let y = 0;

    timerId = setInterval(() => {
      if (!isPlaying) return;

      const idx = (y * w + x) * 4;
      const r = imgData[idx];     // R -> Frecuencia / Nota
      const g = imgData[idx + 1]; // G -> Volumen
      const b = imgData[idx + 2]; // B -> (Disponible)

      // R mapeado a escala Do-Si
      const noteIdx = Math.floor((r / 255) * (freqScale.length - 1));
      const freq = freqScale[noteIdx];
      const noteName = noteNames[noteIdx];

      // G mapeado a volumen
      const volume = (g / 255) * 0.3;

      if (volume > 0.005) {
        playTone(freq, volume);
      }

      status.textContent = `Píxel (${x}, ${y}) | R:${r} -> ${noteName} | G:${g} -> Vol: ${Math.round((g/255)*100)}% | B:${b}`;

      x++;
      if (x >= w) {
        x = 0;
        y++;
      }

      if (y >= h) {
        stopAudio();
        status.textContent = 'Sonificación finalizada.';
      }
    }, 80); // Velocidad óptima de reproducción (80ms por nota)
  });

  function stopAudio() {
    isPlaying = false;
    if (timerId) clearInterval(timerId);
    playBtn.disabled = false;
    stopBtn.disabled = true;
  }

  stopBtn.addEventListener('click', () => {
    stopAudio();
    status.textContent = 'Sonificación pausada.';
  });
</script>

</body>
</html>
