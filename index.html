<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonificador RGB: Proyecto Nebulosa</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 25px; background: #0b0b10; color: #fff; }
    .container { max-width: 750px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    h2 { margin: 0 0 10px 0; font-size: 1.6rem; font-weight: 700; }
    
    .image-preview-container {
      position: relative;
      width: 100%;
      height: 400px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #222;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #displayImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #pointer {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffcc, inset 0 0 5px #00ffcc;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    
    #hiddenCanvas { display: none; }

    .controls { display: flex; gap: 12px; }
    button { padding: 12px 24px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 0.95rem; transition: background 0.2s; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    #status { font-family: monospace; background: #111827; padding: 14px; border-radius: 6px; border: 1px solid #1f2937; color: #10b981; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sonificador RGB: Proyecto Nebulosa</h2>
  
  <div class="image-preview-container" id="stage">
    <img id="displayImage" alt="Nebulosa HD" crossOrigin="anonymous">
    <div id="pointer"></div>
  </div>
  
  <canvas id="hiddenCanvas"></canvas>

  <div class="controls">
    <button id="playBtn" disabled>Iniciar Sonificación</button>
    <button id="stopBtn" disabled>Detener</button>
  </div>
  
  <div id="status">Cargando imagen de la nebulosa...</div>
</div>

<script>
  const displayImage = document.getElementById('displayImage');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const pointer = document.getElementById('pointer');
  const ctx = hiddenCanvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  let audioCtx = null;
  let isPlaying = false;
  let timerId = null;

  // Escala temperada armónica expandida (Do3 a Si5)
  const freqScale = [
    130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94,
    261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
    523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77
  ];

  const noteNames = [
    "Do3","Re3","Mi3","Fa3","Sol3","La3","Si3",
    "Do4","Re4","Mi4","Fa4","Sol4","La4","Si4",
    "Do5","Re5","Mi5","Fa5","Sol5","La5","Si5"
  ];

  // Fotografía real de Nebulosa Espacial de alta fidelidad vía CDN seguro sin CORS lock
  displayImage.src = "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=800&auto=format&fit=crop";

  displayImage.addEventListener('load', () => {
    const PROC_SIZE = 80;
    let w = displayImage.naturalWidth || 800;
    let h = displayImage.naturalHeight || 500;
    
    if (w > h) {
      h = Math.round((h * PROC_SIZE) / w);
      w = PROC_SIZE;
    } else {
      w = Math.round((w * PROC_SIZE) / h);
      h = PROC_SIZE;
    }

    hiddenCanvas.width = w;
    hiddenCanvas.height = h;
    
    try {
      ctx.drawImage(displayImage, 0, 0, w, h);
      playBtn.disabled = false;
      status.textContent = 'Imagen de la nebulosa cargada. Presiona "Iniciar Sonificación".';
    } catch (e) {
      // Fallback seguro si falla la carga remota de red
      generateHighResFallback();
    }
  });

  displayImage.addEventListener('error', () => {
    generateHighResFallback();
  });

  function generateHighResFallback() {
    const c = document.createElement('canvas');
    c.width = 800; c.height = 500;
    const cx = c.getContext('2d');
    
    const grad = cx.createRadialGradient(400, 250, 20, 400, 250, 400);
    grad.addColorStop(0, '#4f46e5');
    grad.addColorStop(0.3, '#7c3aed');
    grad.addColorStop(0.6, '#db2777');
    grad.addColorStop(0.9, '#050515');
    grad.addColorStop(1, '#000000');
    
    cx.fillStyle = grad;
    cx.fillRect(0, 0, 800, 500);

    // Renderizar nubes fotográficas compuestas
    for(let i=0; i<30; i++) {
      const rx = Math.random()*800, ry = Math.random()*500, r = Math.random()*150+50;
      const g = cx.createRadialGradient(rx, ry, 0, rx, ry, r);
      g.addColorStop(0, 'rgba(6, 182, 212, 0.4)');
      g.addColorStop(1, 'transparent');
      cx.fillStyle = g; cx.beginPath(); cx.arc(rx, ry, r, 0, Math.PI*2); cx.fill();
    }

    displayImage.src = c.toDataURL();
  }

  // Motor de síntesis original con curva envolvente suave
  function playTone(freq, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.12);
  }

  function updatePointer(x, y, w, h) {
    const rect = displayImage.getBoundingClientRect();
    const stageRect = document.getElementById('stage').getBoundingClientRect();

    const px = (x / w) * rect.width + (rect.left - stageRect.left);
    const py = (y / h) * rect.height + (rect.top - stageRect.top);

    pointer.style.left = `${px}px`;
    pointer.style.top = `${py}px`;
  }

  playBtn.addEventListener('click', () => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isPlaying = true;
    playBtn.disabled = true;
    stopBtn.disabled = false;
    pointer.style.display = 'block';

    const w = hiddenCanvas.width;
    const h = hiddenCanvas.height;
    const imgData = ctx.getImageData(0, 0, w, h).data;
    
    let x = 0, y = 0;

    timerId = setInterval(() => {
      if (!isPlaying) return;

      const idx = (y * w + x) * 4;
      const r = imgData[idx];
      const g = imgData[idx + 1];
      const b = imgData[idx + 2];

      const noteIdx = Math.floor((r / 255) * (freqScale.length - 1));
      const freq = freqScale[noteIdx];
      const noteName = noteNames[noteIdx];
      const volume = (g / 255) * 0.25;

      if (volume > 0.005) {
        playTone(freq, volume);
      }

      updatePointer(x, y, w, h);
      status.textContent = `Posición (${x}, ${y}) | R:${r} -> ${noteName} | G:${g} -> Vol: ${Math.round((g/255)*100)}% | B:${b}`;

      x++;
      if (x >= w) { x = 0; y++; }
      if (y >= h) {
        stopAudio();
        status.textContent = 'Sonificación finalizada.';
      }
    }, 80);
  });

  function stopAudio() {
    isPlaying = false;
    if (timerId) clearInterval(timerId);
    playBtn.disabled = false;
    stopBtn.disabled = true;
    pointer.style.display = 'none';
  }

  stopBtn.addEventListener('click', stopAudio);
</script>

</body>
</html>
