<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega 4 - Sonificación de Imágenes | Taller de Interfaces</title>
  <style>
    body {
      background-color: #0b0b10;
      color: #e0e0e8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p {
      color: #8a8aa0;
      font-size: 0.95rem;
      margin: 0;
    }

    .canvas-container {
      position: relative;
      max-width: 90vw;
      max-height: 70vh;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }

    /* Mantiene resolución nativa sin degradar pixelado */
    #imageCanvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      cursor: crosshair;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .info-panel {
      margin-top: 15px;
      padding: 12px 20px;
      background: #14141d;
      border-radius: 6px;
      border: 1px solid #232333;
      font-family: monospace;
      font-size: 0.85rem;
      color: #00e676;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sonificación de Imágenes: Nebulosa Espacial</h1>
    <p>Taller de Interfaces UAI | Mapeo cromático a parámetros sonoros</p>
  </header>

  <div class="canvas-container">
    <canvas id="imageCanvas"></canvas>
  </div>

  <div class="info-panel" id="status">Haz clic o pasa el cursor sobre la imagen para activar la sonificación.</div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');

    let audioCtx = null;
    let img = new Image();
    img.src = 'img/Nebulosa.webp';

    // Frecuencias de escala armónica (Pentatónica de Piano en varias octavas)
    const pianoScale = [
      130.81, 146.83, 164.81, 196.00, 220.00, // Octava 3
      261.63, 293.66, 329.63, 392.00, 440.00, // Octava 4
      523.25, 587.33, 659.25, 783.99, 880.00, // Octava 5
      1046.50, 1174.66, 1318.51, 1567.98, 1760.00 // Octava 6
    ];

    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
    };

    function playAudioMapping(r, g, b) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      // 1. Canal R -> Frecuencia de Nota (Piano)
      const noteIdx = Math.floor((r / 255) * (pianoScale.length - 1));
      const freq = pianoScale[noteIdx];

      // 2. Canal G -> Volumen (Amplitud)
      const gainVal = (g / 255) * 0.4;

      // 3. Canal B -> Efecto de Modulación (Trémolo LFO)
      const fxRate = (b / 255) * 12; // 0 Hz a 12 Hz

      if (gainVal <= 0.01) return;

      // Generación Sonora
      const osc = audioCtx.createOscillator();
      const mainGain = audioCtx.createGain();

      osc.type = 'triangle'; // Simulación de tono cálido tipo piano
      osc.frequency.setValueAtTime(freq, now);

      // Efecto Trémolo (LFO)
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(fxRate, now);
      lfoGain.gain.setValueAtTime(gainVal * 0.3, now);
      lfo.connect(lfoGain.gain);

      // Envolvente de volumen (Attack / Release)
      mainGain.gain.setValueAtTime(0.001, now);
      mainGain.gain.linearRampToValueAtTime(gainVal, now + 0.03);
      mainGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);

      osc.connect(mainGain);
      mainGain.connect(audioCtx.destination);

      lfo.start(now);
      osc.start(now);
      osc.stop(now + 1.0);
      lfo.stop(now + 1.0);

      statusEl.textContent = `RGB(${r},${g},${b}) => Frecuencia: ${Math.round(freq)}Hz | Volumen: ${Math.round(gainVal*100)}% | FX Trémolo: ${fxRate.toFixed(1)}Hz`;
    }

    function processPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        playAudioMapping(pixel[0], pixel[1], pixel[2]);
      }
    }

    let throttleTimer = 0;
    canvas.addEventListener('mousemove', (e) => {
      if (Date.now() - throttleTimer > 90) {
        processPointer(e);
        throttleTimer = Date.now();
      }
    });

    canvas.addEventListener('click', processPointer);
  </script>
</body>
</html>
